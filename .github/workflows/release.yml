name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.3.13"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.3.13; got $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version files match tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const version = process.env.VERSION;
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoToml = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoLock = readFileSync('src-tauri/Cargo.lock', 'utf8');
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          const lockLiteraVersion = cargoLock.match(/\nname = "litera"\nversion = "([^"]+)"/)?.[1];

          const checks = {
            'package.json': packageVersion,
            'src-tauri/tauri.conf.json': tauriVersion,
            'src-tauri/Cargo.toml': cargoVersion,
            'src-tauri/Cargo.lock': lockLiteraVersion,
          };

          for (const [file, value] of Object.entries(checks)) {
            if (value !== version) {
              console.error(`${file} version mismatch: expected ${version}, got ${value ?? '<missing>'}`);
              process.exitCode = 1;
            }
          }
          NODE
        env:
          VERSION: ${{ steps.meta.outputs.version }}


  release:
    name: Build and publish (${{ matrix.platform }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: "--bundles deb,rpm,appimage"
          - platform: windows-2025
            bundles: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libfuse2t64 \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile


      - name: Build signed updater artifacts and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: "LitFolio ${{ needs.preflight.outputs.tag }}"
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          args: ${{ matrix.bundles }}
