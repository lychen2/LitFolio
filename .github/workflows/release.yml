name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: "--bundles deb,rpm,appimage"
          - platform: windows-2025
            bundles: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libfuse2 \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LitFolio ${{ github.ref_name }}"
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            ### Added
            - Reader full-width mode: the global navigation sidebar auto-hides on the reader page so the PDF gets the whole window. Slam the cursor to the far-left edge to slide it back in, or pin it open (preference is remembered).
            - Reader: collapsible highlights and notes panels — toggle them from the toolbar to give the PDF even more room; layout is persisted.

            ### Changed
            - Faster knowledge graph: `graph_data` now batches its queries instead of one SELECT per paper/concept.
            - Faster duplicate scan: exact DOI/arXiv matches use SQL grouping and title comparison is length-bucketed (no more full O(N²) sweep).
            - Library tags load in a single batched call instead of one request per row.
            - Folder import runs up to 4 PDFs concurrently.
            - In-folder search is pushed down to the backend instead of filtering on the client.

            ### Fixed
            - Duplicate merge referenced stale table/column names and could fail mid-merge.
            - Reader/Settings: localized previously hardcoded strings and tightened i18n typing; added an i18n consistency check.
            - Cleaner startup error handling and removal of dead code paths flagged after dropping a blanket allow.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.bundles }}
