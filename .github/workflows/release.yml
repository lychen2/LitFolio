name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: "--bundles deb,rpm,appimage"
          - platform: windows-2025
            bundles: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libfuse2 \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LitFolio ${{ github.ref_name }}"
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            ### Fixed
            - DeepSeek V4 / reasoning models: chain-of-thought no longer leaks into translate/summary/ask answers. `thinking:disabled` for chat models, reasoning preserved for R1/o1/o3.
            - Translation JSON extraction now uses `rfind('{')` — resilient to leading prose or reasoning text with embedded braces.
            - Empty translation results now return a clear error instead of silent failure.
            - Library QA degraded search chain (AND → raw question → OR → fuzzy CJK phrase → recent-paper fallback) — no more dead "no papers found" page.
            - Settings: typing a provider name no longer loses input focus.
            - Error display: robust `errorMessage()` helper handles Tauri v2's varied error shapes.
            - Manual: fixed blank first page caused by `titlepage` environment.

            ### Added
            - Markdown rendering for AI answers (bold, italic, lists, headings, code blocks).
            - `search_or` method for broader FTS5 recall.
            - `fuzzy_phrases` for Chinese question tokenization.

            ### Changed
            - Version bump to 0.3.2.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.bundles }}
