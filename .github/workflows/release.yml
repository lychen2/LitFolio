name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: "--bundles deb,rpm,appimage"
          - platform: windows-2025
            bundles: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libfuse2t64 \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:strict

      - name: Frontend tests
        run: pnpm test

      - name: Install Playwright browsers (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows)
        if: matrix.platform == 'windows-2025'
        run: pnpm exec playwright install chromium

      - name: Browser smoke test
        run: pnpm run test:e2e

      - name: Build frontend
        run: pnpm run build

      - name: Bundle report
        run: pnpm run bundle:report

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LitFolio ${{ github.ref_name }}"
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            ### Added
            - Candidate Inbox for triaging papers from RSS, arXiv browse, search, and topic surveys before importing them into the library.
            - Research Projects for grouping papers around a research question, with project-scoped Ask, weekly review signals, source manifests, and AI writing outlines.
            - Evidence Board for collecting excerpts from highlights, Ask answers, comparisons, notes, and manual entries, with Markdown export.
            - AI-generated paper comparison reports from selected library papers.
            - Knowledge Graph decision panel with unread-paper, concept-coverage, cluster, and evidence-chain signals.
            - Data & Privacy settings panel showing storage, sync, model bindings, and network-using features.

            ### Changed
            - Library rows now support multi-select batch actions for queueing, AI comparison, literature review, and citation export.
            - Reader notes are now a 10-section Reading Card with structured prompts for findings, evidence, datasets, metrics, project relevance, quotes, and open questions.
            - Highlights can be categorized by type, including method, dataset, result, limitation, comparison, quote, and question.
            - Topic surveys can be saved as Markdown knowledge notes.
            - Import flows can mark candidate papers as imported, and ignored candidates are hidden from discovery surfaces.
            - Bundled Chinese and English manuals are updated for the v0.3.4 workflows.

            ### Fixed
            - Windows release tests now compare canonicalized PDF and manual-note paths instead of platform-specific path strings.
            - Rust library tests cover the release-critical path roundtrips used by local PDF import and knowledge notes.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.bundles }}
