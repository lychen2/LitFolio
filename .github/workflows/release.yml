name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: "--bundles deb,rpm,appimage"
          - platform: windows-2025
            bundles: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libfuse2t64 \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:strict

      - name: Frontend tests
        run: pnpm test

      - name: Install Playwright browsers (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows)
        if: matrix.platform == 'windows-2025'
        run: pnpm exec playwright install chromium

      - name: Browser smoke test
        run: pnpm run test:e2e

      - name: Build frontend
        run: pnpm run build

      - name: Bundle report
        run: pnpm run bundle:report

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LitFolio ${{ github.ref_name }}"
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            ### Added
            - CI workflow for pull requests and `main` pushes, covering frontend checks, Rust checks, and app smoke tests.
            - Playwright smoke coverage for the Vite/Tauri mock shell.
            - Runtime schema validation around high-value frontend API boundaries.
            - Migration regression coverage for upgrading older library databases.
            - Bundle reporting as a release quality gate.

            ### Changed
            - Release builds now run typecheck, strict lint, frontend tests, browser smoke tests, bundle report, Rust formatting, clippy, and Rust tests before publishing artifacts.
            - Tauri security policy is tightened with an explicit CSP and a narrowed asset protocol scope.
            - Markdown rendering is centralized through the shared safe renderer, including KaTeX support and XSS regression tests.
            - Large frontend, API, storage, command, sync, and AI modules were split by domain to reduce coupling and review risk.
            - PDF loading now uses the Tauri asset protocol path instead of returning full PDF byte arrays through invoke.
            - Library sync, WebDAV, startup, and event paths now expose clearer failure details.

            ### Fixed
            - Rust formatting and clippy warnings are clean under `-D warnings`.
            - Markdown table cells, raw HTML-like input, fenced code blocks, and math rendering no longer rely on scattered page-local HTML builders.
            - Graph concept extraction reports partial failures instead of silently skipping failed papers.
            - Highlight explanation data is covered by schema migration and storage tests.
            - Several stale compatibility paths and dead command wrappers were removed.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.bundles }}
