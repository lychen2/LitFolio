name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: "--bundles deb,rpm,appimage"
          - platform: windows-2025
            bundles: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libfuse2t64 \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:strict

      - name: Frontend tests
        run: pnpm test

      - name: Install Playwright browsers (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows)
        if: matrix.platform == 'windows-2025'
        run: pnpm exec playwright install chromium

      - name: Browser smoke test
        run: pnpm run test:e2e

      - name: Build frontend
        run: pnpm run build

      - name: Bundle report
        run: pnpm run bundle:report

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LitFolio ${{ github.ref_name }}"
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            ### Added
            - GitHub Releases based auto-update support with signed Tauri updater artifacts.

            ### Changed
            - WebDAV library sync now uses the sync manifest as a sha256 file list and skips unchanged files.
            - Sync uploads verify remote file existence and size before skipping, so manually deleted remote files are restored.
            - Pull sync reuses unchanged local files and still verifies downloaded files against manifest sha256 checksums.

            ### Fixed
            - Paper deletion now surfaces filesystem removal failures instead of silently leaving orphan paper folders.
            - Sync snapshots ignore orphan paper folders that no longer exist in the database.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.bundles }}
